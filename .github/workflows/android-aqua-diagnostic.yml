name: Android Aqua Native Diagnostic

on:
  push:
    branches: [diagnostic/android-aqua-015y-20261028]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-native-aqua:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'
      - name: Preserve all JVM cases and compile real APKs
        run: gradle :core:test :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --console=plain
      - name: Record the exact package source
        env:
          MODELATLAS_SOURCE_COMMIT: ${{ github.sha }}
        run: python3 release/android-metadata.py
      - name: Prepare bounded real-device probe
        run: |
          cat > /tmp/modelatlas-aqua-qa.sh <<'SH'
          set -euo pipefail
          python3 release/android_emulator_preflight.py
          aqua_test_status=0
          gradle :app:connectedDebugAndroidTest -Pandroid.enableAdditionalTestOutput=true -Pandroid.testInstrumentationRunnerArguments.expectedMaxHeapBytes=536870912 -Pandroid.testInstrumentationRunnerArguments.allowAquaSystemTest=true -Pandroid.testInstrumentationRunnerArguments.class=dev.modelatlas.app.data.AppearanceSettingsStoreTest,dev.modelatlas.app.ui.AquaArtworkAssetsTest,dev.modelatlas.app.ui.AquaInterfaceFlowTest --no-daemon --console=plain || aqua_test_status=$?
          python3 release/android_emulator_preflight.py --capture-runtime
          exit "$aqua_test_status"
          SH
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: bash /tmp/modelatlas-aqua-qa.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modelatlas-android-aqua-diagnostic
          path: |
            app/build/outputs/apk/
            core/build/test-results/
            app/build/reports/tests/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/connected_android_test_additional_output/
            release-output/android.json
          if-no-files-found: error
