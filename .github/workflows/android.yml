name: Android Build and Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest runners preinstall the Android SDK; setup-android@v3 is broken on them.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'
      - name: Unit tests and APKs
        run: gradle :core:test :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --console=plain
      - name: Record installable APK provenance and signing certificate
        env:
          MODELATLAS_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 release/android-metadata.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modelatlas-debug-and-reports
          path: |
            app/build/outputs/apk/
            core/build/reports/tests/
            core/build/test-results/
            app/build/reports/tests/
            app/schemas/
            release-output/android.json
          if-no-files-found: warn

  device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: vps/go.sum
      - name: Start real TLS workspace hub for native sync integration
        run: |
          cd vps
          go test -c -o /tmp/modelatlas-native-fixture .
          MODELATLAS_NATIVE_FIXTURE_OUT=/tmp/modelatlas-native-fixture.json /tmp/modelatlas-native-fixture -test.run '^TestWorkspaceAndroidFixture$' -test.timeout=35m > /tmp/modelatlas-native-fixture.log 2>&1 &
          for i in $(seq 1 30); do
            if test -f /tmp/modelatlas-native-fixture.json; then break; fi
            sleep 1
          done
          test -f /tmp/modelatlas-native-fixture.json
          python3 - <<'PY'
          import json, os
          with open('/tmp/modelatlas-native-fixture.json') as f:
              data = json.load(f)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('WORKSPACE_FIXTURE_URL=' + data['url'] + '\n')
              f.write('WORKSPACE_CHUNKS_FIXTURE_URL=' + data['chunks_url'] + '\n')
              f.write('WORKSPACE_FIXTURE_CERTIFICATE=' + data['certificate'] + '\n')
              f.write('WORKSPACE_FIXTURE_ADMIN=' + data['admin'] + '\n')
          PY
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: |
            python3 release/android_emulator_preflight.py
            gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.expectedMaxHeapBytes=536870912 -Pandroid.testInstrumentationRunnerArguments.workspaceFixture="$WORKSPACE_FIXTURE_URL" -Pandroid.testInstrumentationRunnerArguments.workspaceChunksFixture="$WORKSPACE_CHUNKS_FIXTURE_URL" -Pandroid.testInstrumentationRunnerArguments.workspaceCertificate="$WORKSPACE_FIXTURE_CERTIFICATE" -Pandroid.testInstrumentationRunnerArguments.workspaceAdmin="$WORKSPACE_FIXTURE_ADMIN" --no-daemon --console=plain
            python3 release/android_emulator_preflight.py --capture-runtime
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modelatlas-device-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
