name: Cancel superseded release wait
on:
  push:
    branches: [operations/cancel-stale-release-20261021]
permissions:
  contents: read
jobs:
  cancel:
    if: github.repository == 'Tsenjii/ModelAtlas-2' && github.ref == 'refs/heads/operations/cancel-stale-release-20261021'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
      - name: Cancel only the old unbuildable source waiting for missing PR checks
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/Tsenjii/ModelAtlas-2/actions/runs/39533431499 > /tmp/modelatlas-stale-run.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("/tmp/modelatlas-stale-run.json").read_text())
          assert r["head_sha"]=="974104bb3114810e24349a0d30e22cdb1984223c"
          assert r["path"]==".github/workflows/release.yml"
          assert r["repository"]["full_name"]=="Tsenjii/ModelAtlas-2"
          assert r["event"]=="push"
          print("Verified superseded source and exact release workflow; application tests and public assets are untouched.")
          PY
          if [ "$(gh api repos/Tsenjii/ModelAtlas-2/actions/runs/39533431499 --jq .status)" != completed ]; then
            gh run cancel 39533431499 --repo Tsenjii/ModelAtlas-2
          fi
