name: Metadata Publication Diagnostic

on:
  push:
    branches: [diagnostic/metadata-publication-015x-20261028]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-vm-counterexample:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: |
            python3 release/android_emulator_preflight.py
            gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.expectedMaxHeapBytes=536870912 -Pandroid.testInstrumentationRunnerArguments.class=dev.modelatlas.app.data.MyModelsMetadataRetryStateTest#c1PublicationContentionKeepsAllFiveCallersInOneFlight --no-daemon --console=plain
            python3 release/android_emulator_preflight.py --capture-runtime
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modelatlas-metadata-publication-counterexample
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: error
