name: Conversation Workspace Focused Diagnostic
on:
  push:
    branches: [diagnostic/vps-conversation-019-20261031]
permissions:
  contents: read
concurrency:
  group: conversation-workspace-019
  cancel-in-progress: true
jobs:
  conversation-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          cache-dependency-path: vps/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vps/e2e/package-lock.json
      - name: Bound official dependency downloads
        run: |
          sudo tee /etc/apt/apt.conf.d/80-modelatlas-ci >/dev/null <<'APT'
          Acquire::Retries "1";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          APT
          for apt_source in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list /etc/apt/*mirrors*.txt; do
            if [ -f "$apt_source" ]; then
              sudo sed -i 's|mirror[+]file:/etc/apt/apt-mirrors\.txt|https://archive.ubuntu.com/ubuntu|g; s|http://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g; s|http://archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$apt_source"
            fi
          done
      - name: Install the original pinned browser and CJK fonts
        working-directory: vps/e2e
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Exact source and real conversation workflow
        working-directory: vps
        env:
          MODELATLAS_BROWSER_TEST: "1"
          PLAYWRIGHT_MODULE: playwright
        run: |
          set -o pipefail
          mkdir -p diagnostics
          git rev-parse HEAD > diagnostics/source.txt
          git rev-parse 'HEAD^{tree}' >> diagnostics/source.txt
          git diff --exit-code
          go test -mod=readonly -race -json -run '^TestBrowserConversationsWorkflow$' -count=1 -timeout=2m . | tee diagnostics/conversations.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modelatlas-conversation-workspace-diagnostic
          path: |
            vps/diagnostics/
            vps/e2e/screenshots/
          if-no-files-found: error
