name: Portable VPS contract diagnostic
on:
  push:
    branches: [diagnostic/vps-portable-ops-20261030]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: false
      - name: Install actual encrypted transfer tool
        run: |
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get install -y rclone
          rclone version
          mkdir -p portable-tools
          cp /usr/bin/rclone portable-tools/rclone
          sha256sum portable-tools/rclone > portable-tools/SHA256SUMS.txt
      - name: Real private configuration, HTTPS, online snapshots and crypt recovery
        working-directory: vps
        env:
          MODELATLAS_CLOUD_BACKUP_TEST: '1'
        run: |
          set -o pipefail
          go mod download
          go test -mod=readonly -race -json -count=1 -run '^TestPortable' -timeout=3m . | tee portable-contracts.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modelatlas-portable-contracts
          path: vps/portable-contracts.jsonl
          if-no-files-found: warn
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real Chromium and language fonts
        working-directory: vps/e2e
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Actual backup UI, encrypted readback and original-ID recovery
        working-directory: vps
        env:
          MODELATLAS_BROWSER_TEST: '1'
          PLAYWRIGHT_MODULE: 'playwright'
        run: |
          set -o pipefail
          go test -mod=readonly -race -json -count=1 -run '^TestBrowserPortableCloudBackup' -timeout=3m . | tee portable-browser.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modelatlas-portable-browser
          path: |
            vps/portable-browser.jsonl
            vps/e2e/screenshots/
          if-no-files-found: warn

      - name: Preserve exact developer toolchain for local diagnostics
        if: always()
        run: |
          mkdir -p portable-developer-tools
          tar -czf portable-developer-tools/go.tar.gz -C "$(go env GOROOT)" .
          tar -czf portable-developer-tools/modules.tar.gz -C "$(go env GOMODCACHE)" .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modelatlas-portable-go-toolchain
          path: portable-developer-tools/
          compression-level: 0
          if-no-files-found: error

  portable-containers:
    name: portable-container-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: false
      - name: Actual native container, Compose, Caddy TLS, vault, SSE and encrypted recovery
        working-directory: vps
        env:
          MODELATLAS_CONTAINER_TEST: '1'
          MODELATLAS_CONTAINER_REPORT: portable-container.json
        run: |
          set -o pipefail
          go mod download
          go test -mod=readonly -race -json -count=1 -run '^TestPortableContainer' -timeout=8m . | tee portable-container.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modelatlas-portable-container-${{ matrix.arch }}
          path: |
            vps/portable-container.json
            vps/portable-container.jsonl
          if-no-files-found: warn
